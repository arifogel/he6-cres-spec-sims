# he6_cres_spec_sims example config file.
# if sim_daq: you must specify number acquisitions and acquisition time and event rates.

Settings:
    rand_seed: 715
    sim_daq: True #If true will simulate daq and create spec file, if false no need to fill out daq section

Physics:
    events_to_simulate : 100 #if sim_daq==True will instead calculate appropriate event rate for each spec file
    betas_to_simulate : 100
    beta_rate: 1.5e+4
    freq_acceptance_low: 17.0e+9 #Note: this is the "extended bandwidth" corresponding to energies where betas can be born. Decreasing low is more important than increasing high.
    freq_acceptance_high: 20.8e+9
    energy:
        distribution: "beta_decay"
        isotope: "He6"
        b: 0
    rho:
        distribution: "uniform_annulus"
        rho_min : 0.0
        rho_max : 5.78e-3
    z:
        distribution: "uniform"
        low : -1.5e-2
        high : 1.5e-2
    min_theta : 89.0
    max_theta : 90.0

EventBuilder:
    main_field : 1.700468
    trap_current : .1
    decay_cell_radius : 5.78e-3

TrackBuilder:
    start_time:
        distribution: "uniform"
        low: 0
        high: 9.0e-2
    track_length:
        distribution: "exponential"
        tau: 1.0e-3
    energy_loss:
        distribution: "aseev"
        isotope : "H2"
    scattering_angle:
        distribution: "fixed"
        value: 0.0
    frac_elastic: 0.01 #Fraction of scatters that are elastic (instantly escape)
    jump_num_max : 3
    voltage_on_time_ms: 0.168
    voltage_off_time_ms: 4.0
    voltage_fractional_offset: 0.1 #Eventually make a distribution?

SideBandBuilder:
    sideband_num: 0
    frac_total_track_power_cut : 0.01
    harmonic_sidebands: True
    magnetic_modulation: False

DMTrackBuilder:
    mixer_freq: 17.9e+9

DAQ:
    acq_length: 0.1 #file duration in [s]
    n_acquisitions: 1 #For N seconds of data per run, TrackBuilder::start_time should be uniformly distributed from 0 to acq_length
    freq_bw: 2.4e+9
    freq_bins: 8192
    n_channels: 2 #Divide freq_bins into n_channel output files, per acquisition
    roach_avg: 2
    roach_inverted_flag: True # this effectively deletes every other file when roach_avg=2
    requant_gain: 7
    noise_file_gain: 7 #requant gain that the noise profile was taken with
    build_labels: False
    noise_paths: #list of paths to .spec files. If not included or do not exist, default to white noise, constant gain
         - "/Users/buzinsky/Builds/DAQ/He6DAQ/pyqt5_GUI/temp/Freq_data_2024-10-04-19-13-35-206_0.spec"
         - "/Users/buzinsky/Builds/DAQ/He6DAQ/pyqt5_GUI/temp/Freq_data_2024-10-04-19-13-35-206_1.spec"
    spec_prefix: "SNR_dev"
    #Warning , zero-suppression + roach_inverted_flag=False + roach_avg > 2 is super slow due to thresholds not being set for that case. Just do .spec
    spec_suffix: "speck"
    threshold_factor: 7
    vaunix_bin: 301.03 #not necessarily perfect tuning to Fourier bin
    vaunix_power_db: -1
