# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: ec25c1dca1a4a74c0efaa48052b4ea99a9ac19d7 # frozen: 8.5.1.3
    hooks:
      - id: buildifier
        args: ["-lint=fix"]
      - id: buildifier-lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2700fd5671c633760d912769c041bfcde2b9a01b # frozen: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
        exclude: &arifogel |
          (?x)^(
            config_files/example_run\.py|
            run_local_experiment\.py|
            src/he6_cres_spec_sims/__init__\.py|
            src/he6_cres_spec_sims/constants\.py|
            src/he6_cres_spec_sims/experiment\.py|
            src/he6_cres_spec_sims/run_simulation\.py|
            src/he6_cres_spec_sims/simulation\.py|
            src/he6_cres_spec_sims/simulation_blocks/Band\.py|
            src/he6_cres_spec_sims/simulation_blocks/DAQ\.py|
            src/he6_cres_spec_sims/simulation_blocks/__init__\.py|
            src/he6_cres_spec_sims/simulation_blocks/config\.py|
            src/he6_cres_spec_sims/simulation_blocks/dmTrackBuilder\.py|
            src/he6_cres_spec_sims/simulation_blocks/eventBuilder\.py|
            src/he6_cres_spec_sims/simulation_blocks/physics\.py|
            src/he6_cres_spec_sims/simulation_blocks/sideBandBuilder\.py|
            src/he6_cres_spec_sims/simulation_blocks/trackBuilder\.py|
            src/he6_cres_spec_sims/spec_tools/__init__\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/__init__\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/coil_classes/__init__\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/coil_classes/coil_form\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/coil_classes/field_profile\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/coil_classes/trap_profile\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/load_default_field_profiles\.py|
            src/he6_cres_spec_sims/spec_tools/creating_trap_geometries/load_field_profile\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/__init__\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/aseev_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/base_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/beta_decay_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/cauchy_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/dirac_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/distribution_interface\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/exponential_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/normal_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/rudd_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/uniform_annulus_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/distributions/uniform_distribution\.py|
            src/he6_cres_spec_sims/spec_tools/spec_calc/__init__\.py|
            src/he6_cres_spec_sims/spec_tools/spec_calc/exb\.py|
            src/he6_cres_spec_sims/spec_tools/spec_calc/power_calc\.py|
            src/he6_cres_spec_sims/spec_tools/spec_calc/spec_calc\.py|
            src/he6_cres_spec_sims/spec_tools/trap_field_profile\.py|
            src/he6_cres_spec_sims/spec_tools/trap_field_profile_pkl/__init__\.py|
            test/__init__\.py|
            test/conftest\.py|
            test/test_simulation_blocks\.py
          )$
      - id: ruff-format
        types_or: [python, pyi]
        exclude: *arifogel
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: c04e74b560392d1602e683cfacff9ad134738f49 # frozen: v17.14.1
    hooks:
      - id: stylelint
        args: [--fix]
        additional_dependencies:
          - stylelint@^16.2.0
          - stylelint-config-standard@^36.0.0
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(yaml|yml)$
        exclude: ^config_files/
  - repo: https://github.com/djlint/djLint
    rev: d69c3510ebf3e850e0fa00cb998f83bfc6f87c88 # frozen: v1.42.1
    hooks:
      - id: djlint-reformat
        types_or: [jinja, html]
        files: \.(jinja|jinja2|html\.jinja)$
      - id: djlint
        types_or: [jinja, html]
        files: \.(jinja|jinja2|html\.jinja)$
